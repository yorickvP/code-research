[package]
name = "nix-hello-world-plugin"
version = "0.1.0"
edition = "2021"
description = "A Nix plugin that adds builtins.helloWorld using nix-bindings-sys"
license = "MIT"

[lib]
name = "nix_hello_world_plugin"
crate-type = ["cdylib"]

[dependencies]
# Raw FFI bindings to the Nix C API (from the notashelf/nix-bindings repo).
# The crate is not separately published to crates.io, so we reference the git repo
# directly. Cargo resolves workspace members by crate name.
nix-bindings-sys = { git = "https://github.com/notashelf/nix-bindings", version = "2.32.4" }
# Provides Rust global constructor support (equivalent to __attribute__((constructor)))
ctor = "0.2"

# Speed up bindgen compilation during dev builds (mirrors upstream recommendation)
[profile.dev.package.bindgen]
opt-level = 3
