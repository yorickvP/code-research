[workspace]
members = [".", "nix-bindings-macros"]
resolver = "2"

[package]
name = "nix-hello-world-plugin"
version = "0.1.0"
edition = "2021"
description = "A Nix plugin that adds builtins.helloWorld using nix-bindings-sys"
license = "MIT"

[lib]
name = "nix_hello_world_plugin"
crate-type = ["cdylib"]

[dependencies]
nix-bindings-sys = { git = "https://github.com/notashelf/nix-bindings", version = "2.32.4" }
nix-bindings-macros = { path = "nix-bindings-macros" }
# ctor is needed because we use auto_register = true
ctor = "0.2"

# Speed up bindgen compilation during dev builds (mirrors upstream recommendation)
[profile.dev.package.bindgen]
opt-level = 3
